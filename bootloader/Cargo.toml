[package]
name = "bootloader"
description = "UEFI bootloader that boots Linux via the x86 boot protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log = "0.4.34"
uefi = { version = "0.40.0", features = ["logger", "panic_handler", "alloc", "global_allocator"] }
bzimage = { version = "0.1.0", path = "../bzimage" }
config = { version = "0.1.0", path = "../config" }
